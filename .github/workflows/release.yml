name: Release

on:
  push:
    tags:
      - "v*"

# Never cancel a release in flight. Cancelling between "create release" and the
# asset upload publishes a tag whose downloads 404 — and install.sh, install.ps1
# and in-app apply all fail closed on a missing asset, so a half-published
# release is worse than a queued one. Two tags in quick succession queue.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # github.com/allbin/agentkit is private, so an unauthenticated build
      # resolves it through the public proxy and gets a 404. Same PAT dance as
      # ci.yml: hold the credential only for the download, then unset it, so
      # `npm ci` and the build steps cannot read it back out of ~/.gitconfig.
      # The module cache is warm afterwards and needs no credential.
      - name: Download private Go modules
        run: |
          git config --global url."https://${{ secrets.ALLBIN_GH_PAT }}@github.com/allbin/".insteadOf "https://github.com/allbin/"
          cd backend && go mod download
          git config --global --unset-all url."https://${{ secrets.ALLBIN_GH_PAT }}@github.com/allbin/".insteadOf
        env:
          GOPRIVATE: github.com/allbin/*

      - name: Build frontend
        run: cd frontend && npm ci --no-audit --no-fund && npm run build

      - name: Embed frontend into backend
        run: |
          rm -rf backend/internal/server/frontend_dist
          mkdir -p backend/internal/server/frontend_dist
          cp -r frontend/dist/* backend/internal/server/frontend_dist/

      # Build wide, enable narrow (docs/upgrades.md, decision U5).
      # Cross-compiling is free with CGO_ENABLED=0, so every platform we can
      # build gets an asset and a working install.sh. Whether a platform may
      # SELF-upgrade is a separate, narrower list in
      # backend/internal/update/platform.go — keep the asset names in step
      # with it, or apply downloads a 404.
      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # buildOrigin=release keeps the source channel OFF on every machine
          # that installs one of these. It is the only thing that can: building
          # locally at an exact tag stamps the same bare tag, and main.commit is
          # set on both paths (docs/upgrades.md).
          LDFLAGS="-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE} -X main.buildOrigin=release"
          cd backend
          export GOPRIVATE='github.com/allbin/*'
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o "../dist/agentique-linux-amd64" ./cmd/agentique
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o "../dist/agentique-linux-arm64" ./cmd/agentique
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o "../dist/agentique-windows-amd64.exe" ./cmd/agentique
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o "../dist/agentique-darwin-arm64" ./cmd/agentique

      # Bare filenames, no ./ prefix — in-app apply matches asset names against
      # this file exactly as install.sh does.
      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/agentique-linux-amd64
            dist/agentique-linux-arm64
            dist/agentique-windows-amd64.exe
            dist/agentique-darwin-arm64
            dist/checksums.txt
