name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Download private modules with the PAT, then remove it. Leaving it in a
      # global git config keeps a usable credential in ~/.gitconfig for the
      # rest of the job, where any later step — or anything a build runs — can
      # read it. The module cache is already warm afterwards, so the steps
      # below need no credential at all.
      - name: Download private Go modules
        run: |
          git config --global url."https://${{ secrets.ALLBIN_GH_PAT }}@github.com/allbin/".insteadOf "https://github.com/allbin/"
          cd backend && go mod download
          git config --global --unset-all url."https://${{ secrets.ALLBIN_GH_PAT }}@github.com/allbin/".insteadOf
        env:
          GOPRIVATE: github.com/allbin/*

      - name: Go vet
        run: cd backend && go vet ./...
        env:
          GOPRIVATE: github.com/allbin/*

      - name: Go vulnerability check
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0 && cd backend && govulncheck ./...
        env:
          GOPRIVATE: github.com/allbin/*

      - name: Windows cross-compile
        run: cd backend && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
        env:
          GOPRIVATE: github.com/allbin/*

      - name: Go test
        run: cd backend && go test ./... -count=1 -race -short
        env:
          GOPRIVATE: github.com/allbin/*

  # Windows build coverage is provided cheaply by the `backend` job's
  # cross-compile step (GOOS=windows) on the Linux runner. A dedicated
  # windows-latest runtime-test job was dropped to save Actions minutes
  # (Windows runners bill at 2× and several tests assume a unix environment).

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: npm audit
        run: cd frontend && npm audit

      - name: Biome check
        run: cd frontend && npx biome check src/

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Vitest
        run: cd frontend && npx vitest run

  typegen-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same as the backend job: hold the PAT only for the download, so `npm ci`
      # and everything after it cannot read it out of ~/.gitconfig.
      - name: Download private Go modules
        run: |
          git config --global url."https://${{ secrets.ALLBIN_GH_PAT }}@github.com/allbin/".insteadOf "https://github.com/allbin/"
          cd backend && go mod download
          git config --global --unset-all url."https://${{ secrets.ALLBIN_GH_PAT }}@github.com/allbin/".insteadOf
        env:
          GOPRIVATE: github.com/allbin/*

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Regenerate types
        run: cd backend && go run ./cmd/typegen --out ../frontend/src/lib
        env:
          GOPRIVATE: github.com/allbin/*

      - name: Check for drift
        run: git diff --exit-code frontend/src/lib/generated-types.ts frontend/src/lib/generated-schemas.ts
